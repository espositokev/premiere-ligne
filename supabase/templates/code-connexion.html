<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f4f2ee;
      font-family: Arial, Helvetica, sans-serif;
      color: #072820;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f2ee; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border: 1px solid #e8e4dc;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="background: #0b3d2e; padding: 20px 28px">
                <span
                  style="
                    display: inline-block;
                    width: 28px;
                    height: 6px;
                    background: #d4ff3a;
                    vertical-align: middle;
                    margin-right: 10px;
                  "
                ></span>
                <span
                  style="
                    color: #f4f2ee;
                    font-weight: 800;
                    font-size: 16px;
                    letter-spacing: 0.5px;
                    vertical-align: middle;
                  "
                  >PREMIÈRE LIGNE</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 28px">
                <h1 style="margin: 0 0 12px; font-size: 22px; color: #072820">
                  Votre code de connexion
                </h1>
                <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.5">
                  Saisissez ce code sur la page de connexion :
                </p>
                <p
                  style="
                    margin: 0 0 20px;
                    font-size: 36px;
                    font-weight: 800;
                    letter-spacing: 10px;
                    color: #072820;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5f635d">
                  Ce code est valable une heure et ne sert qu'une fois. Si vous n'avez pas demandé à
                  vous connecter, ignorez cet email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
